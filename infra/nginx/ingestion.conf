# nginx site for ingestion.handsoffretail.com (single file).
# Install:
#   sudo cp infra/nginx/ingestion.conf /etc/nginx/sites-available/ingestion.handsoffretail.com
#   sudo ln -s /etc/nginx/sites-available/ingestion.handsoffretail.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ingestion.handsoffretail.com   # adds https (443), certificate and http->https redirect
# Uses the login rate-limit zone "hor_auth_login" defined in the auth.handsoffretail.com site (do not define it again).

server {
    listen 80;
    listen [::]:80;
    server_name ingestion.handsoffretail.com;

    # Bigger request bodies are not needed: uploads do not go through the browser.
    client_max_body_size 1m;

    # Bare domain -> the console
    location = / {
        return 302 /admin/;
    }

    # Ingestion console (built with base /admin/)
    location ^~ /admin/ {
        alias /opt/hor/store-automation/hor-ingestion/ingestion-console/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Auth API on this host too, so login/refresh/logout stay same-origin (cookies)
    location = /api/auth/login {
        limit_req zone=hor_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8091/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Gilbarco ingestion API (longer prefix, so it wins over /api/ingestion/)
    location /api/ingestion/gilbarco/ {
        proxy_pass http://127.0.0.1:8093/api/ingestion/gilbarco/;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Verifone ingestion API (all other /api/ingestion/ paths)
    location /api/ingestion/ {
        proxy_pass http://127.0.0.1:8092/api/ingestion/;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
